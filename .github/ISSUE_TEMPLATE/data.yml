name: Lexicon data issue
description: Report a problem with a word, form, gloss, example or attribution
body:
  - type: input
    id: entry
    attributes:
      label: Word or form
      description: Include the part of speech and sense ID if available.
    validations:
      required: true
  - type: input
    id: snapshot
    attributes:
      label: Dataset version or build ID
      description: For a local build, include the source and its version or checksum.
  - type: textarea
    id: reproduction
    attributes:
      label: What did you find?
      description: Paste the query or record, the actual result and the expected result.
    validations:
      required: true
